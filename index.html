<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marthi Megwani – Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--surface:#fff;--ink:#16302a;--muted:#5d726b;--line:#d9e3de;--brand:#14463a;--on-brand:#fff;--accent:#f2b705;--on-accent:#2a2200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--surface:#16262f;--ink:#e8f1ed;--muted:#97aba3;--line:#27403a;--brand:#2f8f75;--on-brand:#04130e;--accent:#f2b705;--on-accent:#2a2200}}
:root[data-theme="dark"]{--bg:#0e1a17;--surface:#16262f;--ink:#e8f1ed;--muted:#97aba3;--line:#27403a;--brand:#2f8f75;--on-brand:#04130e;--accent:#f2b705;--on-accent:#2a2200}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{padding:28px 0 12px}
h1{font:800 34px/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.5px}
.sub{color:var(--muted);margin:6px 0 0}
.chip{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:700;padding:4px 12px;border-radius:99px;font-size:14px;margin-top:12px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-weight:600}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
h2{font:800 20px "Bricolage Grotesque",system-ui,sans-serif;margin:22px 0 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.name{font-weight:700;display:flex;align-items:center;gap:8px}
.veg{width:14px;height:14px;border:2px solid #1a9a4a;display:inline-grid;place-items:center;flex:none;border-radius:3px}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:#1a9a4a}
.desc{color:var(--muted);font-size:14px;margin:2px 0 0}
.price{font-weight:700;margin-top:4px}
.add{border:2px solid var(--brand);color:var(--brand);background:transparent;font:inherit;font-weight:800;padding:8px 20px;border-radius:10px;min-width:84px}
.qty{display:flex;align-items:center;background:var(--brand);color:var(--on-brand);border-radius:10px;min-width:84px;justify-content:space-between}
.qty button{background:none;border:0;color:inherit;font:800 20px/1 inherit;padding:8px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bar button,.cta{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;border:0;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:800;padding:15px 18px;border-radius:14px;text-decoration:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.row{display:flex;justify-content:space-between;padding:6px 0}
.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.close{float:right;border:0;background:none;color:var(--muted);font:inherit;padding:4px}
.note{color:var(--muted);font-size:13px;margin-top:10px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marthi Megwani</h1>
    <p class="sub">Tap karke order karein. Menu seedha phone par.</p>
    <span class="chip" id="tableChip">Table –</span>
  </header>
  <nav id="tabs" aria-label="Menu categories"></nav>
  <main id="menu"></main>
</div>

<div class="bar" id="bar" hidden>
  <button id="openCart"><span id="cnt">0 items</span><span id="sum">₹0</span></button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Aapka order">
  <div class="panel">
    <button class="close" id="close">Band karein</button>
    <h2 style="margin-top:0">Aapka order</h2>
    <div id="lines"></div>
    <div class="row total"><span>Total</span><span id="tot">₹0</span></div>
    <label for="tbl">Table number</label>
    <input id="tbl" inputmode="numeric" placeholder="Jaise 5">
    <label for="nm">Aapka naam</label>
    <input id="nm" placeholder="Naam likhein">
    <p class="note">Order cafe ke WhatsApp par jayega. Payment counter par ya UPI se hoga.</p>
    <a class="cta" id="send" href="#" target="_blank" rel="noopener"><span>Order bhejein</span><span id="tot2">₹0</span></a>
    <button class="close" id="copyBtn" type="button" style="float:none;display:block;margin:12px auto 0">WhatsApp na khule to message copy karein</button>
  </div>
</div>

<script>
// Cafe ka WhatsApp number (country code ke saath, + ke bina). Yahan apna number badlein.
var WA = "917354103448";
var CATS = {
  "Momos":[["Atta Momos Steam (Half)","Bhaap mein pake",30,1],["Atta Momos Steam (Full)","Bhaap mein pake",50,1],["Atta Momos Fried (Half)","Crispy tale hue",40,1],["Atta Momos Fried (Full)","Crispy tale hue",60,1]],
  "Snacks":[["Vada Pav","Garam aur teekha",25,1],["Burger","Taaza bana hua",50,1],["Sandwich","Toast kiya hua",40,1]]
};
var cart = {}, items = [], current = "Momos";
Object.keys(CATS).forEach(function(c){CATS[c].forEach(function(r){items.push({id:items.length,cat:c,name:r[0],desc:r[1],price:r[2]})})});

function $(i){return document.getElementById(i)}
function inr(n){return "₹"+n}
// Table number: published page mein #table-5 se aata hai. Apni site par ?table=5 use karein.
var m = location.hash.match(/^#table-(\d+)$/);
var table = m ? m[1] : "";
$("tableChip").textContent = table ? "Table " + table : "Table chunein";
$("tbl").value = table;

function renderTabs(){
  $("tabs").innerHTML = "";
  Object.keys(CATS).forEach(function(c){
    var b = document.createElement("button");
    b.textContent = c; b.setAttribute("aria-pressed", c === current);
    b.onclick = function(){current = c; renderTabs(); renderMenu()};
    $("tabs").appendChild(b);
  });
}
function renderMenu(){
  var h = "<h2>" + current + "</h2>";
  items.filter(function(i){return i.cat === current}).forEach(function(i){
    var q = cart[i.id] || 0;
    h += '<div class="item"><div><div class="name"><span class="veg" title="Veg"></span>' + i.name + '</div><p class="desc">' + i.desc + '</p><div class="price">' + inr(i.price) + '</div></div>' +
      (q ? '<div class="qty"><button data-d="-1" data-id="' + i.id + '" aria-label="Kam karein">−</button><span>' + q + '</span><button data-d="1" data-id="' + i.id + '" aria-label="Badhayein">+</button></div>'
         : '<button class="add" data-d="1" data-id="' + i.id + '">Add</button>') + '</div>';
  });
  $("menu").innerHTML = h;
}
function totals(){
  var n = 0, s = 0;
  items.forEach(function(i){var q = cart[i.id] || 0; n += q; s += q * i.price});
  return {n:n, s:s};
}
function refresh(){
  var t = totals();
  $("bar").hidden = t.n === 0;
  $("cnt").textContent = t.n + (t.n === 1 ? " item" : " items");
  $("sum").textContent = inr(t.s) + "  Order dekhein";
  renderMenu(); renderSheet();
}
function renderSheet(){
  var t = totals(), h = "";
  items.forEach(function(i){var q = cart[i.id]; if(q) h += '<div class="row"><span>' + q + " × " + i.name + '</span><span>' + inr(q * i.price) + '</span></div>'});
  $("lines").innerHTML = h || "<p class='note'>Abhi kuch nahi chuna.</p>";
  $("tot").textContent = inr(t.s); $("tot2").textContent = inr(t.s);
  if (t.n === 0) $("sheet").classList.remove("open");
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-id]"); if(!b) return;
  var id = b.getAttribute("data-id"), d = +b.getAttribute("data-d");
  cart[id] = Math.max(0, (cart[id] || 0) + d); refresh();
});
$("openCart").onclick = function(){$("sheet").classList.add("open")};
$("close").onclick = function(){$("sheet").classList.remove("open")};
$("send").onclick = function(){
  var t = totals(), msg = "Naya order\nTable: " + ($("tbl").value || "-") + "\nNaam: " + ($("nm").value || "-") + "\n\n";
  items.forEach(function(i){var q = cart[i.id]; if(q) msg += q + " x " + i.name + " = " + inr(q * i.price) + "\n"});
  msg += "\nTotal: " + inr(t.s);
  this.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
};
$("copyBtn").onclick = function(){
  var t = totals(), msg = "Naya order\nTable: " + ($("tbl").value || "-") + "\nNaam: " + ($("nm").value || "-") + "\n\n";
  items.forEach(function(i){var q = cart[i.id]; if(q) msg += q + " x " + i.name + " = " + inr(q * i.price) + "\n"});
  msg += "\nTotal: " + inr(t.s);
  var btn = this, ok = function(){btn.textContent = "Copy ho gaya. Ab WhatsApp mein paste karein"};
  try{ navigator.clipboard.writeText(msg).then(ok, function(){fb()}); }catch(e){ fb(); }
  function fb(){var a = document.createElement("textarea"); a.value = msg; document.body.appendChild(a); a.select(); try{document.execCommand("copy"); ok();}catch(e){} document.body.removeChild(a);}
};
renderTabs(); refresh();
</script>
</body>
</html>
